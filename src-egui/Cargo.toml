[package]
name = "live48-egui"
version = "0.1.0"
description = "live48 native egui client"
edition = "2021"

[dependencies]
eframe = "0.35"
egui = "0.35"
egui_extras = { version = "0.35", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
url = "2.5.8"
libloading = "0.8"
bytemuck = "1"
raw-window-handle = "0.6"
env_logger = "0.11"
zip = "0.6"

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["json", "stream", "rustls-tls", "blocking"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# egui/wgpu are the hot loops; an unoptimised dependency copy makes the whole UI crawl.
[profile.dev.package."*"]
opt-level = 2
